@if (loading()) {
<p>در حال دریافت تسک‌ها...</p>
} @else if (errorMessage()) {
<p>{{ errorMessage() }}</p>
} @else {
<h1>{{ title }}</h1>

<p>تعداد کل: {{ tasks().length }}</p>
<p>تعداد انجام‌شده‌ها: {{ completedCount() }}</p>

<button (click)="addTask()">افزودن تسک</button>

<button (click)="toggleList()">
  نمایش / پنهان‌کردن لیست
</button>

@if (showTasks()) {
<ul>
  @for (task of tasks(); track task.id) {
  <li>
    <app-task-card [task]="task" (toggleRequested)="toggleTask($event)" />
  </li>
  }
</ul>
}
}
