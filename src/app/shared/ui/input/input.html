<label [for]="id()">{{ label() }}</label>
<input
  [id]="id()"
  [type]="type()"
  [placeholder]="placeholder()"
  [value]="value()"
  [disabled]="disabled()"
  [attr.aria-invalid]="errorMessage() ? 'true' : null"
  [attr.aria-describedby]="errorMessage() ? id() + '-error' : null"
  (input)="handleInput($event)"
  (blur)="handleBlur()"
/>
@if (errorMessage()) {
  <p [id]="id() + '-error'" role="alert">{{ errorMessage() }}</p>
}
